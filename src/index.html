<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screen Recorder</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="app-background">
      <div class="animated-bg"></div>
    </div>

    <div class="container">
      <header class="header">
        <div class="header-content">
          <div class="logo">
            <i class="fas fa-video"></i>
          </div>
          <h1 class="title">Screen Recorder</h1>
          <p class="subtitle">Capture your screen with ease</p>
        </div>
      </header>

      <main class="main-content">
        <div class="status-bar">
          <div class="status-item">
            <i class="fas fa-circle status-icon" id="status-icon"></i>
            <span id="status-text">Ready</span>
          </div>
          <div class="timer" id="timer" style="display: none">
            <i class="fas fa-clock"></i>
            <span id="timer-display">00:00</span>
          </div>
        </div>

        <div class="video-wrapper">
          <div class="video-container">
            <video id="video" autoplay></video>
            <div class="video-overlay" id="video-overlay">
              <i class="fas fa-desktop"></i>
              <p>Select a source to begin</p>
            </div>
          </div>
        </div>

        <div class="controls">
          <button id="recorded-video" class="btn btn-select btn-block">
            <i class="fas fa-desktop"></i>
            <span>Select Source</span>
          </button>

          <div class="button-group">
            <button
              id="start-recording"
              class="btn btn-success btn-block"
              disabled
            >
              <i class="fas fa-circle"></i>
              <span>Start Recording</span>
            </button>
            <button
              id="stop-recording"
              class="btn btn-danger btn-block"
              disabled
            >
              <i class="fas fa-stop"></i>
              <span>Stop Recording</span>
            </button>
          </div>
        </div>

        <div
          class="playback-section"
          id="playback-section"
          style="display: none"
        >
          <div class="section-header">
            <i class="fas fa-film"></i>
            <h3>Recorded Video Playback</h3>
          </div>

          <div class="playback-container">
            <video id="playback-video" controls></video>
          </div>

          <div class="playback-controls">
            <button id="close-playback" class="btn btn-secondary btn-block">
              <i class="fas fa-times"></i>
              <span>Close Playback</span>
            </button>
          </div>
        </div>
      </main>
    </div>
    <script src="render.js"></script>
  </body>
</html>
